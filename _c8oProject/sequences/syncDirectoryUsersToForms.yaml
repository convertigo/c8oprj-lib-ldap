  value: ${lib_UserManager.ldapServer}
↓ldapBasePath [variables.RequestableVariable-1774272301102]: 
  comment: Default LDAP base DN used when usersBasePath is not provided
  value: ${lib_UserManager.ldapBasePath}
↓adminPassword [variables.RequestableVariable-1774272301104]: 
  value: 
    - ↑ciphered: true
    - ↑traceable: false
    - →→: x530464aa1e63d0f98506f75047888822cd14101585f94218a48f6594c8d671cc5363d6aa941b84b949231422a2651cd9
  visibility: '-1'
↓usersBasePath [variables.RequestableVariable-1774272301106]: 
  comment: Optional LDAP base DN dedicated to user extraction. Falls back to ldapBasePath when empty.
↓userSearchFilter [variables.RequestableVariable-1774272301108]: 
  comment: LDAP filter applied to the directory accounts to import into Forms. {{today}} or {{today:FORMAT}} (FORMAT being a Java SimpleDateFormat pattern) is replaced by the current date, e.g. (|(!(expiry=*))(expiry>={{today:yyyyMMdd}})). Default can be driven by symbol lib_LDAP.userSearchFilter.
  value: ${lib_LDAP.userSearchFilter=(&(objectCategory=person)(objectClass=user))}
↓userExclusionFilter [variables.RequestableVariable-1774272301110]: 
  comment: Optional LDAP filter for directory accounts to exclude from the Forms synchronization. Supports the {{today}} token. Default can be driven by symbol lib_LDAP.userExclusionFilter.
  value: ${lib_LDAP.userExclusionFilter=}
↓userAccountNamePattern [variables.RequestableVariable-1790000000007]: 
  comment: Optional regular expression, matched case-insensitively against the account identifier (before lowercase normalization). Users that do not match are not synchronized, e.g. ^(AC750|UR[0-9]{3})[^TG]. Prefer [0-9] to backslash escapes, which must be doubled in symbol files. Default can be driven by symbol lib_LDAP.userAccountNamePattern.
  value: ${lib_LDAP.userAccountNamePattern=}
↓userExpiryAttribute [variables.RequestableVariable-1790000000012]: 
  comment: Optional attribute holding the user exit date. Users whose date is strictly before today (minus userExpiryGraceDays) are not synchronized and are hidden by the reconciliation; users without a date are kept; unparseable dates are kept and reported in the summary. The date is evaluated at each run. Default can be driven by symbol lib_LDAP.userExpiryAttribute.
  value: ${lib_LDAP.userExpiryAttribute=}
↓userExpiryDateFormat [variables.RequestableVariable-1790000000013]: 
  comment: Java SimpleDateFormat pattern of userExpiryAttribute, parsed strictly, e.g. dd/MM/yyyy or yyyyMMddHHmmss. Default can be driven by symbol lib_LDAP.userExpiryDateFormat.
  value: ${lib_LDAP.userExpiryDateFormat=dd/MM/yyyy}
↓userExpiryGraceDays [variables.RequestableVariable-1790000000014]: 
  comment: Number of days a user is still synchronized after the exit date. 0 keeps the user up to and including the exit day. Default can be driven by symbol lib_LDAP.userExpiryGraceDays.
  value: ${lib_LDAP.userExpiryGraceDays=0}
↓userDistinguishedNameMarkers [variables.RequestableVariable-1780055692091]: 
  comment: Optional comma/newline-separated distinguishedName markers. When provided, only users whose distinguishedName contains at least one marker are synchronized. Default can be driven by symbol lib_LDAP.userDistinguishedNameMarkers.
  value: ${lib_LDAP.userDistinguishedNameMarkers=}
↓includeRDN [variables.RequestableVariable-1774272301112]: 
  comment: Kept for compatibility, not used by the synchronization.
  value: false
↓pageSize [variables.RequestableVariable-1776185313173]: 
  comment: LDAP paged results size and number of users written to Forms per batch. Use a value greater than 0. Default 500.
  value: 500.0
↓countLimit [variables.RequestableVariable-1774272301114]: 
  comment: Maximum number of directory users to synchronize across all pages. Use 0 for no limit.
  value: 0
↓timeLimit [variables.RequestableVariable-1774272301116]: 
  comment: LDAP time limit passed to the search. Use 0 for no limit.
  value: 0
↓bulkMergeRules [variables.RequestableVariable-1774272301118]: 
  comment: Merge rules applied when upserting Forms user documents
  value: '{"mail": "override", "displayName": "override"}'
↓formsGroupPrefix [variables.RequestableVariable-1774272301120]: 
  comment: Prefix used to build the reserved Forms group identifier for each synchronized user
  value: C8Oreserved_
↓formsProvider [variables.RequestableVariable-1774272301122]: 
  comment: Provider value written in synchronized Forms user documents
  value: ad
↓formsLanguage [variables.RequestableVariable-1774272301124]: 
  comment: Language value written in synchronized Forms user documents
  value: fr
↓formsFavorites [variables.RequestableVariable-1774272301126]: 
  comment: Favorites value written in synchronized Forms user documents
↓formsPublishedFirst [variables.RequestableVariable-1774272301128]: 
  comment: published_First value written in synchronized Forms user documents
  value: true
↓formsEditingRights [variables.RequestableVariable-1774272301130]: 
  comment: editing_rights value written in synchronized Forms user documents
  value: true
↓clearCacheAfterSync [variables.RequestableVariable-1774272301132]: 
  comment: Set to true to clear Convertigo cache entries after the Forms synchronization
  value: true
↓dryRun [variables.RequestableVariable-1774272301134]: 
  comment: Set to true to prepare the Forms payloads without writing to FullSync databases
  value: false
↓debugUserCreationLogs [variables.RequestableVariable-1780408773455]: 
  comment: Set to true to log per-user preparation, lowercase normalization and PostBulkDocuments responses during the Forms synchronization
  value: ${lib_LDAP.debugUserCreationLogs=false}
↓reconcileAbsentUsers [variables.RequestableVariable-1790000000004]: 
