↓includeDirectoryGroups [variables.RequestableVariable-1780071693997]: 
  comment: Directory group lookup is mandatory. This variable is kept for compatibility but is forced to true by the sequence.
  value: true
↓groupsBasePath [variables.RequestableVariable-1780071694048]: 
  comment: LDAP base DN dedicated to group lookup. Uses the same symbol as lib_UserManager.
  value: ${lib_UserManager.ldapBasePathGroup=}
↓groupObjectClass [variables.RequestableVariable-1780071694073]: 
  comment: LDAP objectClass value identifying directory groups. Uses the same symbol as lib_UserManager.
  value: ${lib_UserManager.LDAP_GROUP_OBJECT_CLASS=group}
↓groupSearchFilter [variables.RequestableVariable-1780071694096]: 
  comment: Advanced override for the LDAP group filter, e.g. (&(objectClass=groupOfUniqueNames)(|(cn=GROUP_A)(cn=GROUP_B))). Leave empty to use lib_UserManager.LDAP_GROUP_OBJECT_CLASS. Supports the {{today}} token. Default can be driven by symbol lib_LDAP.groupSearchFilter.
  value: ${lib_LDAP.groupSearchFilter=}
↓groupLookupMode [variables.RequestableVariable-1790000000010]: 
  comment: preload (default) reads the groups matching groupSearchFilter once and resolves memberships in memory; perUser runs one LDAP group search per user, slow for large directories. Default can be driven by symbol lib_LDAP.groupLookupMode.
  value: ${lib_LDAP.groupLookupMode=preload}
↓groupMemberAttribute [variables.RequestableVariable-1780071694206]: 
  comment: LDAP group attribute that contains the user distinguishedName (uniqueMember for groupOfUniqueNames, member for groupOfNames or Active Directory). lib_UserManager currently uses uniqueMember in its group lookup. Default can be driven by symbol lib_LDAP.groupMemberAttribute.
  value: ${lib_LDAP.groupMemberAttribute=uniqueMember}
↓groupDisplayAttributes [variables.RequestableVariable-1780071694228]: 
  comment: Comma/newline-separated group attributes used to build the Forms directory group name. Uses the same symbol as lib_UserManager.
  value: ${lib_UserManager.LDAP_GROUP_DISPLAY_ATTRIBUTE=cn}
↓formsDirectoryGroupPrefix [variables.RequestableVariable-1780071694251]: 
  comment: Prefix added to LDAP directory group names before SetUserInGroupBulk. Same behavior as lib_UserManager group mappings.
  value: ad:
↓groupLookupCountLimit [variables.RequestableVariable-1780071694271]: 
  comment: Maximum number of LDAP groups looked up per user in perUser group lookup mode. Use 0 for no limit.
  value: 0
↓groupLookupTimeLimit [variables.RequestableVariable-1780071694297]: 
  comment: LDAP group lookup time limit per user in milliseconds, in perUser group lookup mode. Use 0 for no limit.
  value: 0
