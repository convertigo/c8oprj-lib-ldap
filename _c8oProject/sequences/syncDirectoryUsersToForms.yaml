↓userAccountNameAttributes [variables.RequestableVariable-1780065580569]: 
  comment: Comma/newline-separated candidate attributes used to build the Forms login, reserved group id and ACL. Defaults to lib_UserManager.LDAP_USER_ID_ATTRIBUTE.
  value: ${lib_UserManager.LDAP_USER_ID_ATTRIBUTE=uid}
↓userMailAttributes [variables.RequestableVariable-1780065580652]: 
